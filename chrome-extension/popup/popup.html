<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tailieu HOU</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <img src="../icons/icon48.png" alt="logo" class="logo" />
    <div class="header-title">
      <h1>Tailieu HOU</h1>
      <span id="status" class="status">đang tải…</span>
    </div>
  </div>

  <section id="login-section" class="section hidden">
    <h2>Đăng nhập</h2>
    <label class="field">
      <span>Email</span>
      <input type="email" id="email" placeholder="you@edu.vn" autocomplete="username" />
    </label>
    <label class="field">
      <span>Mật khẩu</span>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </label>
    <button id="login-btn" class="btn primary">Đăng nhập</button>
    <div class="divider"><span>Hoặc</span></div>
    <button id="google-login-btn" class="btn google">
      <svg class="google-icon" viewBox="0 0 24 24" style="width: 16px; height: 16px;">
        <path fill="#EA4335" d="M5.2662 9.7645C6.1988 6.9386 8.8547 4.9091 12 4.9091C13.6909 4.9091 15.2182 5.5282 16.4 6.5455L19.7364 3.2091C17.6545 1.2227 14.9727 0 12 0C7.33 0 3.3283 2.7815 1.5035 6.7937L5.2662 9.7645Z" />
        <path fill="#34A853" d="M16.0407 18.0126C14.9509 18.7163 13.5661 19.0909 12 19.0909C8.8547 19.0909 6.1988 17.0614 5.2662 14.2355L1.5035 17.2063C3.3283 21.2185 7.33 24 12 24C14.9316 24 17.736 22.9229 19.8315 21.0621L16.0407 18.0126Z" />
        <path fill="#4285F4" d="M23.49 12.2727C23.49 11.4436 23.41 10.68 23.2791 9.9491L12 9.9491V14.5418H18.4527C18.1727 16.05 17.3091 17.22 16.0407 18.0126L19.8315 21.0621C22.0295 19.0432 23.49 16.0091 23.49 12.2727Z" />
        <path fill="#FBBC05" d="M5.2662 9.7645C5.0124 10.5376 4.8727 11.3592 4.8727 12C4.8727 12.6408 5.0124 13.4624 5.2662 14.2355L1.5035 17.2063C0.54898 15.103 0 12.7259 0 12C0 11.2741 0.54898 8.897 1.5035 6.7937L5.2662 9.7645Z" />
      </svg>
      Tiếp tục với Google
    </button>
    <p class="hint">Đăng nhập qua Supabase Auth. Token được lưu trong extension.</p>
    <details class="advanced">
      <summary>Dán token thủ công (dev)</summary>
      <label class="field">
        <span>Access token (JWT Supabase)</span>
        <textarea id="manual-token" rows="3" placeholder="eyJhbGciOi..."></textarea>
      </label>
      <button id="manual-token-btn" class="btn">Lưu token</button>
    </details>
  </section>

  <section id="profile-section" class="section hidden">
    <h2>Tài khoản</h2>
    <div id="profile-info" class="profile-info"></div>
    <button id="logout-btn" class="btn">Đăng xuất</button>
  </section>

  <section class="section">
    <h2>Backend API</h2>
    <label class="field">
      <span>Chế độ kết nối</span>
      <select id="api-mode">
        <option value="auto">Tự động (thử local → prod)</option>
        <option value="local">Local (localhost:3001)</option>
        <option value="prod">Production (onrender)</option>
      </select>
    </label>
    <button id="apply-mode-btn" class="btn">Áp dụng</button>
    <p class="hint">Base URL hiện tại: <code id="current-base">—</code></p>
  </section>

  <section class="section">
    <h2>Cài đặt</h2>
    <label class="toggle-field">
      <input type="checkbox" id="debug-toggle" />
      <span>Bật log debug (console)</span>
    </label>
  </section>

  <script src="../utils/debug.js"></script>
  <script src="popup.js"></script>
</body>
</html>
