<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HOU Quiz Setup</title>
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        .header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 15px;
        }
        .header h3 {
            margin: 0;
            color: #ff9800;
        }
        .section {
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .option-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .option-group:last-child {
            margin-bottom: 0;
        }
        .option-label {
            font-size: 14px;
            font-weight: 500;
        }
        /* Switch styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #4caf50;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>🚀 HOU Quiz Control</h3>
    </div>
    
    <div class="section">
        <div class="option-group">
            <span class="option-label">Tự động chọn tài liệu</span>
            <label class="switch">
                <input type="checkbox" id="auto-select-docs" checked>
                <span class="slider"></span>
            </label>
        </div>
        
        <div class="option-group">
            <span class="option-label">Highlight đáp án đúng</span>
            <label class="switch">
                <input type="checkbox" id="highlight-answers" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="option-group">
            <span class="option-label">Tự động chọn đáp án</span>
            <label class="switch">
                <input type="checkbox" id="auto-select-answers" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="footer">
        HOU Quiz Extension • Thuần JS
    </div>
    <script src="popup.js"></script>
</body>
</html>
