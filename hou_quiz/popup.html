<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>HOU Quiz Control</title>
    <link rel="stylesheet" href="styles/settings/popup.css">
</head>

<body>
    <!-- Header card -->
    <div class="header-card">
        <div class="logo-wrapper">
            <svg width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Vòng tròn nền xanh gradient -->
                <circle cx="24" cy="24" r="22" fill="url(#blueGrad)" />
                <!-- Hình tờ giấy màu trắng -->
                <rect x="14" y="12" width="20" height="24" rx="2" fill="white" />
                <!-- Các dòng chữ trên tờ giấy -->
                <line x1="18" y1="18" x2="30" y2="18" stroke="var(--brand-600)" stroke-width="2.5"
                    stroke-linecap="round" />
                <line x1="18" y1="23" x2="30" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
                <line x1="18" y1="28" x2="26" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
                <!-- Vòng tròn kính lúp nhỏ màu cam góc dưới phải -->
                <circle cx="33" cy="33" r="8" fill="#ff9800" stroke="white" stroke-width="2" />
                <!-- Kính lúp (cán và kính) -->
                <circle cx="32" cy="32" r="3.2" stroke="white" stroke-width="1.5" />
                <line x1="34.5" y1="34.5" x2="37.5" y2="37.5" stroke="white" stroke-width="1.5"
                    stroke-linecap="round" />

                <defs>
                    <linearGradient id="blueGrad" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
                        <stop stop-color="var(--brand-500)" />
                        <stop offset="1" stop-color="var(--brand-600)" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <div class="header-info">
            <h1 class="header-title">HOU Quiz</h1>
            <p class="header-subtitle">Tự động tìm và điền đáp án câu hỏi</p>
        </div>
        <button id="btn-ui-settings" class="settings-btn-top-right" title="Giao diện & Màu sắc">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
        </button>
    </div>

    <!-- Config card -->
    <div class="config-card">
        <div class="connection-status">
            <span class="status-dot"></span>
            <span>Kết nối ưu tiên: API Server (mạng)</span>
        </div>

        <h2 class="config-title">
            <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
            Cấu hình quét
        </h2>

        <!-- Options list -->
        <!-- Manual Document Selection Summary (Hidden by default) -->
        <div id="manual-doc-summary-box" class="manual-summary-container" style="display: none;">
            <div class="summary-content">
                <span class="summary-label">Tài liệu đã chọn:</span>
                <span id="selected-docs-text" class="summary-value">Chưa chọn tài liệu nào</span>
            </div>
            <button id="btn-open-filter-modal" class="filter-icon-btn" type="button" title="Chọn danh mục & tài liệu">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
            </button>
        </div>

        <label class="option-card">
            <input type="checkbox" id="auto-select-docs" checked>
            <span class="custom-checkbox"></span>
            <div class="option-info">
                <span class="option-title">Tự động chọn tài liệu</span>
                <span class="option-desc">Tự động phát hiện môn học và tải tài liệu tương ứng từ cơ sở dữ liệu.</span>
            </div>
        </label>

        <label class="option-card" id="show-info-widget-card">
            <input type="checkbox" id="show-info-widget" checked>
            <span class="custom-checkbox"></span>
            <div class="option-info">
                <span class="option-title">Hiển thị thông tin môn học</span>
                <span class="option-desc">Hiển thị bảng thông tin môn học và tài liệu đã nhận diện ở góc trên bên
                    phải.</span>
            </div>
        </label>

        <label class="option-card">
            <input type="checkbox" id="highlight-answers" checked>
            <span class="custom-checkbox"></span>
            <div class="option-info">
                <span class="option-title">Highlight đáp án đúng</span>
                <span class="option-desc">Tô màu xanh lá nổi bật cho các lựa chọn đáp án đúng trên trang làm bài.</span>
            </div>
        </label>

        <label class="option-card">
            <input type="checkbox" id="auto-select-answers" checked>
            <span class="custom-checkbox"></span>
            <div class="option-info">
                <span class="option-title">Tự động chọn đáp án</span>
                <span class="option-desc">Khi bật, extension sẽ tự động click chọn đáp án đúng sau khi tìm thấy.</span>
            </div>
        </label>

        <label class="option-card">
            <input type="checkbox" id="enable-logs" checked>
            <span class="custom-checkbox"></span>
            <div class="option-info">
                <span class="option-title">Hiển thị log hệ thống</span>
                <span class="option-desc">Hiển thị log chi tiết của extension trong console phục vụ kiểm tra lỗi.</span>
            </div>
        </label>

        <label class="option-card">
            <input type="checkbox" id="show-network-status" checked>
            <span class="custom-checkbox"></span>
            <div class="option-info">
                <span class="option-title">Hiển thị trạng thái mạng</span>
                <span class="option-desc">Hiển thị thanh thông tin kết nối và mạng lưới.</span>
            </div>
        </label>
    </div>

    <!-- UI Settings Modal Overlay (Hidden by default) -->
    <div id="ui-settings-overlay" class="modal-overlay" style="display: none;">
        <div class="ui-settings-modal">
            <div class="modal-header">
                <h3 class="modal-title">Giao diện & Màu sắc</h3>
                <button id="btn-close-ui-settings" class="modal-close-btn" title="Đóng">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="ui-section-label">Chế độ hiển thị</div>
            <div class="theme-grid">
                <button class="theme-btn" id="theme-light" data-value="light">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2" />
                        <path d="M12 20v2" />
                        <path d="M4.93 4.93l1.41 1.41" />
                        <path d="M17.66 17.66l1.41 1.41" />
                        <path d="M2 12h2" />
                        <path d="M20 12h2" />
                        <path d="M6.34 17.66l-1.41 1.41" />
                        <path d="M19.07 4.93l-1.41 1.41" />
                    </svg>
                    <span>Sáng</span>
                </button>
                <button class="theme-btn" id="theme-dark" data-value="dark">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
                    </svg>
                    <span>Tối</span>
                </button>
                <button class="theme-btn" id="theme-system" data-value="system">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="14" rx="2" y="3" x="2" />
                        <line x1="8" y1="21" x2="16" y2="21" />
                        <line x1="12" y1="17" x2="12" y2="21" />
                    </svg>
                    <span>Hệ thống</span>
                </button>
            </div>

            <div class="ui-section-label" style="margin-top: 16px;">Màu chủ đạo</div>
            <div class="color-grid">
                <button class="color-dot green" data-value="green" title="Xanh lá"></button>
                <button class="color-dot blue" data-value="blue" title="Xanh dương"></button>
                <button class="color-dot red" data-value="red" title="Đỏ"></button>
                <button class="color-dot purple" data-value="purple" title="Tím"></button>
                <button class="color-dot orange" data-value="orange" title="Cam"></button>
                <button class="color-dot lime" data-value="lime" title="Vàng xanh"></button>
                <button class="color-dot black" data-value="black" title="Đen"></button>
            </div>
        </div>
    </div>

    <!-- Filter Document Modal Overlay (Hidden by default) -->
    <div id="filter-doc-overlay" class="modal-overlay" style="display: none;">
        <div class="filter-doc-modal">
            <div class="modal-header">
                <h3 class="modal-title">Chọn tài liệu thủ công</h3>
                <button id="btn-close-filter-modal" class="modal-close-btn" type="button" title="Đóng">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="filter-modal-body">
                <div class="select-group">
                    <label class="select-label">Tìm kiếm nhanh:</label>
                    <input type="text" id="modal-search-input" placeholder="Nhập tên môn học, tài liệu..."
                        style="width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--fg); outline: none; box-sizing: border-box; font-size: 12px; font-weight: 500; transition: all 0.2s;">
                </div>

                <div class="select-group" style="margin-top: 10px;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                        <label class="select-label">Danh mục môn học:</label>
                        <label
                            style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; cursor: pointer; color: var(--brand-500); user-select: none;">
                            <input type="checkbox" id="chk-all-categories" style="cursor: pointer; margin: 0;">
                            <span>Chọn tất cả</span>
                        </label>
                    </div>
                    <div id="modal-categories-list" class="categories-checkbox-list">
                        <div class="no-docs-placeholder">Đang tải danh mục...</div>
                    </div>
                </div>

                <div class="select-group" style="margin-top: 10px;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                        <label class="select-label">Danh sách tài liệu:</label>
                        <label
                            style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; cursor: pointer; color: var(--brand-500); user-select: none;">
                            <input type="checkbox" id="chk-all-documents" style="cursor: pointer; margin: 0;">
                            <span>Chọn tất cả</span>
                        </label>
                    </div>
                    <div id="modal-documents-list" class="documents-checkbox-list">
                        <div class="no-docs-placeholder">Hãy chọn danh mục trước</div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button id="btn-clear-docs" class="modal-btn-danger" type="button">Bỏ chọn hết</button>
                <button id="btn-save-filter" class="modal-btn-primary" type="button">Áp dụng</button>
            </div>
        </div>
    </div>

    <div class="footer">
        HOU Quiz Extension
    </div>
    <script src="scripts/common/config.js"></script>
    <script src="scripts/settings/popup.js"></script>
</body>

</html>
