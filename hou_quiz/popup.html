<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HOU Quiz Control</title>
    <style>
        body {
            width: 340px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        
        /* Header section */
        .header-card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        
        .logo-wrapper {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .header-title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
        }
        
        .header-subtitle {
            font-size: 12px;
            color: #64748b;
            margin: 0;
        }
        
        /* Main config card */
        .config-card {
            background: white;
            border-top: 4px solid #3b82f6;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        
        .connection-status {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }
        
        .config-title {
            display: flex;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 16px;
        }
        
        .settings-icon {
            width: 18px;
            height: 18px;
            stroke: #3b82f6;
            stroke-width: 2.5;
            fill: none;
            margin-right: 6px;
        }
        
        /* Options layout as cards */
        .option-card {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .option-card:last-child {
            margin-bottom: 0;
        }
        
        .option-card:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        
        /* Custom checkbox */
        .option-card input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }
        
        .custom-checkbox {
            flex-shrink: 0;
            height: 20px;
            width: 20px;
            background-color: #fff;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            position: relative;
            transition: all 0.2s ease;
            margin-top: 2px;
        }
        
        .option-card input:checked ~ .custom-checkbox {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        
        .custom-checkbox:after {
            content: "";
            position: absolute;
            display: none;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        .option-card input:checked ~ .custom-checkbox:after {
            display: block;
        }
        
        .option-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .option-title {
            font-size: 13.5px;
            font-weight: 600;
            color: #1e293b;
        }
        
        .option-desc {
            font-size: 11px;
            color: #64748b;
            line-height: 1.4;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 16px;
            padding-top: 8px;
            border-top: 1px dashed #e2e8f0;
        }
    </style>
</head>
<body>
    <!-- Header card -->
    <div class="header-card">
        <div class="logo-wrapper">
            <svg width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Vòng tròn nền xanh dương gradient -->
                <circle cx="24" cy="24" r="22" fill="url(#blueGrad)"/>
                <!-- Hình tờ giấy màu trắng -->
                <rect x="14" y="12" width="20" height="24" rx="2" fill="white"/>
                <!-- Các dòng chữ trên tờ giấy -->
                <line x1="18" y1="18" x2="30" y2="18" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="18" y1="23" x2="30" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
                <line x1="18" y1="28" x2="26" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
                <!-- Vòng tròn kính lúp nhỏ màu cam góc dưới phải -->
                <circle cx="33" cy="33" r="8" fill="#ff9800" stroke="white" stroke-width="2"/>
                <!-- Kính lúp (cán và kính) -->
                <circle cx="32" cy="32" r="3.2" stroke="white" stroke-width="1.5"/>
                <line x1="34.5" y1="34.5" x2="37.5" y2="37.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                
                <defs>
                    <linearGradient id="blueGrad" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#3b82f6"/>
                        <stop offset="1" stop-color="#1d4ed8"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <div class="header-info">
            <h1 class="header-title">HOU Quiz</h1>
            <p class="header-subtitle">Tự động tìm và điền đáp án câu hỏi</p>
        </div>
    </div>
    
    <!-- Config card -->
    <div class="config-card">
        <div class="connection-status">
            <span class="status-dot"></span>
            <span>Kết nối ưu tiên: API Server (mạng)</span>
        </div>
        
        <h2 class="config-title">
            <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Cấu hình quét
        </h2>
        
        <!-- Options list -->
        <label class="option-card">
            <input type="checkbox" id="auto-select-docs" checked>
            <span class="custom-checkbox"></span>
            <div class="option-info">
                <span class="option-title">Tự động chọn tài liệu</span>
                <span class="option-desc">Tự động phát hiện môn học và tải tài liệu tương ứng từ cơ sở dữ liệu.</span>
            </div>
        </label>
        
        <label class="option-card">
            <input type="checkbox" id="highlight-answers" checked>
            <span class="custom-checkbox"></span>
            <div class="option-info">
                <span class="option-title">Highlight đáp án đúng</span>
                <span class="option-desc">Tô màu xanh lá nổi bật cho các lựa chọn đáp án đúng trên trang làm bài.</span>
            </div>
        </label>

        <label class="option-card">
            <input type="checkbox" id="auto-select-answers" checked>
            <span class="custom-checkbox"></span>
            <div class="option-info">
                <span class="option-title">Tự động chọn (Auto-select)</span>
                <span class="option-desc">Khi bật, extension sẽ tự động click chọn đáp án đúng sau khi tìm thấy.</span>
            </div>
        </label>

        <label class="option-card">
            <input type="checkbox" id="enable-logs" checked>
            <span class="custom-checkbox"></span>
            <div class="option-info">
                <span class="option-title">Hiển thị log hệ thống</span>
                <span class="option-desc">Hiển thị log chi tiết của extension trong console phục vụ kiểm tra lỗi.</span>
            </div>
        </label>
    </div>
    
    <div class="footer">
        HOU Quiz Extension • Thuần JS
    </div>
    <script src="popup.js"></script>
</body>
</html>
