services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ../backend/.env
    depends_on:
      - redis
    restart: always
    networks:
      - app_network
      - supabase_network

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
    name: tailieu_hou_app_network
  supabase_network:
    external: true
    name: supabase_default
