services:
  9router:
    build: .
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
      REDIS_URL: rediss://default:gQAAAAAAAodjAAIgcDFjMTU2NGMyNmEyYzU0MTgwOTU2NTUxMzkzNDMzOWNkZg@tops-roughy-165731.upstash.io:6379
    depends_on:
      - headroom
      - redis

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  9router-data:
    name: 9router-data
  redis-data:
    name: redis-data
